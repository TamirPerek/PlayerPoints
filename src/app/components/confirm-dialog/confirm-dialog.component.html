@if (visible) {
  <div class="overlay" (click)="cancel()" (keydown.escape)="cancel()">
    <div class="dialog" (click)="$event.stopPropagation()" (keydown)="$event.stopPropagation()">
      <h2>{{ title }}</h2>
      <p>{{ message }}</p>
      <div class="dialog-actions">
        <app-button buttonClass="secondary" (click)="cancel()" (keydown)="cancel()">
          {{ 'confirm.cancel' | translate }}
        </app-button>
        <app-button buttonClass="alert" (click)="confirm()" (keydown)="confirm()">
          {{ 'confirm.confirm' | translate }}
        </app-button>
      </div>
    </div>
  </div>
}
